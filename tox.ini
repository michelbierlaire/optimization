[tox]
envlist = py314, py313, py312, py311, py310
isolated_build = True
requires =
    tox>=4.26.0

[gh-actions]
python:
  3.14: py314
  3.13: py313
  3.12: py312
  3.11: py311
  3.10: py310


[testenv]
# install pytest in the virtualenv where commands will be executed
allowlist_externals = pytest
deps =
    pytest
    pytest-cov
commands = pytest {posargs}
