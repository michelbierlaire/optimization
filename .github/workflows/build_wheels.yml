name: Build and publish package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest  # Source distribution is independent of OS and Python version
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Validate lockfile
        run: uv lock --check
      - name: Build source distribution
        run: uv build --sdist --out-dir dist/
      - name: Upload Source Distribution Artifact
        uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  build:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
    - name: Build wheels
      run: uv build --wheel --out-dir dist/
    - name: Check directory
      run: ls dist
    - name: Upload Artifacts
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
      uses: actions/upload-artifact@v6
      with:
        name: wheels
        path: dist/biogeme_optimization*.whl

  pypi-publish:
    name: upload release to PyPI
    needs: [build_sdist, build]
    runs-on: ubuntu-latest
    # Specifying a GitHub environment is optional, but strongly encouraged
    environment:
      name: release
      url: https://pypi.org/p/biogeme-optimization
    permissions:
      contents: read
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - name: Download Wheel Artifacts
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist

      - name: Download sdist Artifacts
        uses: actions/download-artifact@v7
        with:
          name: sdist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
