[build-system]
requires = [
    "setuptools>=75.6.0",
    "wheel>=0.45.1",
]
build-backend = "setuptools.build_meta"


[project]
name = "biogeme-optimization"
dynamic = ["version"]
requires-python = ">=3.10"
description = "Various optimization algorithms for teaching and research"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Michel Bierlaire", email = "michel.bierlaire@epfl.ch" }]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "numpy>=2.0.2, <3",
    "scipy>=1.13.1, <2",
    "matplotlib>=3.9.4, <4",
    "tomlkit>=0.13.2, <1",
    "lark>=1.2.2",
    "tabulate>=0.9.0",
    "networkx>=3.4",
    "icecream>=2.1.3",
    "dominate>=2.9.1"
]

[project.optional-dependencies]
testing = [
    "pytest >= 8.3.5",
    "pytest-cov >= 6.1.1",
    "tox >= 4.26.0"
]

[project.urls]
Code = "https://github.com/michelbierlaire/optimization"
homepage = "http://biogeme.epfl.ch"
download-url = "https://pypi.org/project/biogeme-optimization"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.0",
    "tox>=4.26.0",
    "tox-gh-actions>=3.2.0",
    "twine>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "biogeme_optimization.version.__version__" }
